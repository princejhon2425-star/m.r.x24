<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Sales | M.R.X Computer Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060606;
      --panel: rgba(16, 16, 16, 0.92);
      --panel-soft: rgba(22, 22, 22, 0.8);
      --line: rgba(255,255,255,0.08);
      --text: #f7f7f7;
      --muted: #d8d8d8;
      --primary: #00d9ff;
      --primary-2: #8ef4ff;
      --shadow: rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      background:
        radial-gradient(circle at top, rgba(0,217,255,0.14), transparent 25%),
        linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.04)),
        url('ChatGPT Image Aug 29, 2026, 08_32_48 PM.png') center/cover fixed no-repeat;
    }

    .page {
      width: min(1200px, calc(100% - 32px));
      margin: 60px auto;
      background: rgba(7,7,7,0.8);
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px var(--shadow);
      backdrop-filter: blur(10px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 30px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,0.38);
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
    }

    .nav a:hover { color: var(--text); }

    .hero {
      padding: 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(17,17,17,0.88);
    }

    .hero-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 4rem);
      letter-spacing: -0.05em;
    }

    .search-wrap {
      flex: 1;
      min-width: 260px;
      max-width: 500px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 14px 16px;
      font: inherit;
      outline: none;
    }

    .search-box button {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #031417;
      font-weight: 700;
      border: none;
      padding: 14px 18px;
      cursor: pointer;
      border-radius: 0 16px 16px 0;
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
      box-shadow: 0 8px 18px rgba(0, 217, 255, 0.2);
    }

    .search-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(0, 217, 255, 0.28);
      filter: brightness(1.05);
    }

    .search-box button:active {
      transform: translateY(0);
      box-shadow: 0 6px 16px rgba(0, 217, 255, 0.2);
    }

    .search-box button:focus-visible {
      outline: 2px solid rgba(142, 244, 255, 0.9);
      outline-offset: 2px;
    }

    .content {
      padding: 28px 32px 38px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .category {
      background: rgba(18,18,18,0.9);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px 16px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .category:hover {
      transform: translateY(-4px);
    }

    .category-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: rgba(0,217,255,0.1);
      border: 1px solid rgba(0,217,255,0.25);
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      font-size: 1.5rem;
    }

    .category h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .category p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 22px;
    }

    .product {
      background: rgba(17,17,17,0.88);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
    }

    .product-image {
      height: 180px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(0,217,255,0.08));
      display: grid;
      place-items: center;
      font-size: 3rem;
      color: var(--primary);
      border-bottom: 1px solid var(--line);
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-body {
      padding: 18px;
    }

    .product-body h3 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .product-body p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.9rem;
    }

    .product-category {
      color: var(--primary-2);
      font-weight: 600;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-2);
    }

    .buy-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .buy-btn:hover {
      background: rgba(255,255,255,0.03);
    }

    @media (max-width: 900px) {
      .categories {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }

      .products {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .categories {
        grid-template-columns: 1fr;
      }

      .hero,
      .content {
        padding: 20px;
      }
    }
  </style>
  <link rel="stylesheet" href="acrylic-buttons.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" data-mrx-content="brand">M.R.X Computer Solutions</div>
      <nav class="nav">
        <a href="home.html">Home</a>
        <a href="home.html#services">Services</a>
        <a href="computer-repair.html">Computer Repair</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <div>
          <h1 data-mrx-content="salesTitle">Computer Sales</h1>
          <p class="sales-intro" data-mrx-content="salesIntro">Browse our available computers, laptops, and upgrades.</p>
        </div>

        <div class="search-wrap">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search computers, laptops, desktops..." />
            <button class="acrylic-btn" type="button">Search</button>
          </div>
        </div>
      </div>
    </section>

    <main class="content">
      <div class="categories">
        <div class="category">
          <div class="category-icon">🖥️</div>
          <h3>Desktops</h3>
          <p>Gaming, office, and business setups.</p>
        </div>

        <div class="category">
          <div class="category-icon">💻</div>
          <h3>Laptops</h3>
          <p>Portable devices for study and work.</p>
        </div>

        <div class="category">
          <div class="category-icon">🧩</div>
          <h3>Upgrades</h3>
          <p>RAM, SSD, and other parts.</p>
        </div>
      </div>

      <div id="productList" class="products" aria-live="polite"></div>
      <p id="noProducts" class="muted" hidden></p>
    </main>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function () {
      MRXSite.renderProducts();
    });
  </script>
  <script src="mrx-site.js"></script>
</body>
</html>
